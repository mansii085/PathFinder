<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Pathfinding Visualizer</title>
    <meta name="description" content="Interactive grid-based pathfinding visualizer with BFS, DFS, Dijkstra, and A* algorithms." />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M3 12h3M18 12h3M12 3v3M12 18v3"/>
          <path d="M6.3 6.3l2.1 2.1M15.6 15.6l2.1 2.1M6.3 17.7l2.1-2.1M15.6 8.4l2.1-2.1"/>
        </svg>
        <span class="brand-title">PathFinder</span>
      </div>

      <div class="navbar-controls">
        <div class="control-group">
          <label class="control-label">Algorithm</label>
          <select id="algorithm-select" class="algo-select">
            <option value="bfs">BFS — Breadth First Search</option>
            <option value="dfs">DFS — Depth First Search</option>
            <option value="dijkstra">Dijkstra's Algorithm</option>
            <option value="astar">A* (A-Star)</option>
          </select>
        </div>

        <button id="btn-visualize" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/></svg>
          Visualize!
        </button>

        <button id="btn-stop" class="btn btn-danger hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12"/></svg>
          Stop
        </button>

        <div class="divider"></div>

        <button id="btn-clear-path" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          Clear Path
        </button>

        <button id="btn-clear-board" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
          Clear Board
        </button>

        <div class="dropdown-group">
          <button id="btn-maze" class="btn btn-secondary dropdown-trigger">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v6M15 15v6M3 9h6M15 9h6M9 15h6"/></svg>
            Generate Maze
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div id="maze-dropdown" class="dropdown-menu hidden">
            <button data-maze="recursive" class="dropdown-item">Recursive Division</button>
            <button data-maze="random" class="dropdown-item">Random Walls (30%)</button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="control-group speed-group">
          <label class="control-label">Speed</label>
          <div class="speed-control">
            <span class="speed-label-sm">Slow</span>
            <input type="range" id="speed-slider" min="0" max="2" step="1" value="1" class="speed-slider">
            <span class="speed-label-sm">Fast</span>
          </div>
        </div>
      </div>
    </nav>

    <!-- Algorithm Info Card -->
    <div id="algo-info-card" class="algo-info-card">
      <div id="algo-info-content"></div>
    </div>

    <!-- Legend -->
    <div class="legend-bar">
      <div class="legend-items">
        <div class="legend-item">
          <div class="legend-swatch source"></div>
          <span>Source</span>
        </div>
        <div class="legend-item">
          <div class="legend-swatch destination"></div>
          <span>Destination</span>
        </div>
        <div class="legend-item">
          <div class="legend-swatch wall"></div>
          <span>Wall</span>
        </div>
        <div class="legend-item">
          <div class="legend-swatch visited"></div>
          <span>Visited</span>
        </div>
        <div class="legend-item">
          <div class="legend-swatch path"></div>
          <span>Shortest Path</span>
        </div>
        <div class="legend-item">
          <div class="legend-swatch empty"></div>
          <span>Empty</span>
        </div>
      </div>
      <div class="legend-hint">
        <span>Click/drag: Draw walls &nbsp;|&nbsp; Drag <span class="hint-src">source</span> or <span class="hint-dst">destination</span> to move them</span>
      </div>
    </div>

    <!-- Grid Container -->
    <div class="grid-wrapper">
      <div id="grid" class="grid"></div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">Algorithm</span>
        <span id="stat-algo" class="stat-value">BFS</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-label">Nodes Visited</span>
        <span id="stat-visited" class="stat-value">—</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-label">Path Length</span>
        <span id="stat-path" class="stat-value">—</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-label">Status</span>
        <span id="stat-status" class="stat-value stat-idle">Ready</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-label">Mode</span>
        <span id="stat-mode" class="stat-value">Normal</span>
        <button id="btn-step-toggle" class="step-toggle-btn" title="Toggle Step-by-Step mode">⇌</button>
      </div>
      <div id="step-controls" class="step-controls hidden">
        <button id="btn-next-step" class="btn btn-step">Next Step →</button>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
